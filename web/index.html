<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DH 正运动学 · Forward Kinematics</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f6f8; color: #1a1a1a; }
  .card { max-width: 880px; margin: 24px auto; background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { font-size: 20px; }
  label { display: inline-block; margin: 4px 8px 4px 0; font-size: 13px; }
  input[type=number] { width: 70px; }
  button { margin-top: 10px; padding: 8px 14px; background: #d33; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  pre { background: #23272e; color: #e6e6e6; padding: 12px; border-radius: 8px; overflow: auto; font-size: 13px; }
  svg { width: 100%; height: 420px; background: #0f1419; border-radius: 8px; }
  .node { fill: #ff5a5a; }
  .link { stroke: #4aa3ff; stroke-width: 4; }
  text { fill: #cfd8dc; font-size: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>标准 DH 参数法 · 正运动学</h1>
  <p>输入各旋转关节角（度），实时绘制机器人连杆骨架与末端位姿。</p>
  <div>
    <label>关节1 <input id="j0" type="number" value="30"></label>
    <label>关节2 <input id="j1" type="number" value="45"></label>
    <label>关节3 <input id="j2" type="number" value="-15"></label>
    <button id="solve">更新骨架</button>
    <button id="example">载入示例</button>
  </div>
  <div id="end" style="margin-top:8px;font-size:13px;color:#555;"></div>
  <svg id="svg" viewBox="-3 3 6 6" preserveAspectRatio="xMidYMid meet"></svg>
  <div id="resp"></div>
</div>
<script>
const LINK_LEN = 1.0;
function buildSpec() {
  const j = [Number(document.getElementById('j0').value),
              Number(document.getElementById('j1').value),
              Number(document.getElementById('j2').value)];
  return {
    links: j.map(() => ({a: LINK_LEN, alpha: 0, d: 0, theta: 0, type: "revolute"})),
    joints: j,
    tcp: [],
    allow_negative_a: false
  };
}
function draw(pts) {
  const svg = document.getElementById('svg');
  svg.innerHTML = "";
  // axes
  const mk = (x1,y1,x2,y2,c,w) => { const l=document.createElementNS("http://www.w3.org/2000/svg","line"); l.setAttribute("x1",x1);l.setAttribute("y1",-y1);l.setAttribute("x2",x2);l.setAttribute("y2",-y2); l.setAttribute("stroke",c);l.setAttribute("stroke-width",w); svg.appendChild(l); };
  mk(-3,0,3,0,"#37474f",1); mk(0,-3,0,3,"#37474f",1);
  let path = "M";
  pts.forEach((p,i) => { path += (i?" L":" ") + p[0].toFixed(3) + " " + (-p[1]).toFixed(3); });
  const poly = document.createElementNS("http://www.w3.org/2000/svg","polyline");
  poly.setAttribute("points", path.replace(/M /g,"").replace(/ L/g," "));
  poly.setAttribute("fill","none"); poly.setAttribute("stroke","#4aa3ff"); poly.setAttribute("stroke-width",4);
  svg.appendChild(poly);
  pts.forEach((p,i) => { const c=document.createElementNS("http://www.w3.org/2000/svg","circle"); c.setAttribute("cx",p[0]);c.setAttribute("cy",-p[1]);c.setAttribute("r",0.12);c.setAttribute("fill","#ff5a5a"); svg.appendChild(c);
    const t=document.createElementNS("http://www.w3.org/2000/svg","text"); t.setAttribute("x",p[0]+0.15);t.setAttribute("y",-p[1]+0.3);t.textContent="O"+i; svg.appendChild(t); });
}
async function solve() {
  const spec = buildSpec();
  const r = await fetch('/api/skeleton', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(spec)});
  if (!r.ok) { document.getElementById('resp').textContent = "错误: " + (await r.text()); return; }
  const data = await r.json();
  if (data.error) { document.getElementById('resp').textContent = "错误: " + data.error; return; }
  draw(data.points);
  document.getElementById('end').textContent = "末端坐标 (x, y, z) = (" + data.points[data.points.length-1].join(", ") + ")";
}
document.getElementById('solve').onclick = solve;
document.getElementById('example').onclick = async () => {
  const r = await fetch('/example/planar-3r.json'); const ex = await r.json();
  document.getElementById('j0').value = ex.joints[0]; document.getElementById('j1').value = ex.joints[1]; document.getElementById('j2').value = ex.joints[2];
  solve();
};
solve();
</script>
</body>
</html>
